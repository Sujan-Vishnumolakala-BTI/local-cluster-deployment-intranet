# ============================================================
# HAProxy Configuration
# Kubernetes API Server Load Balancer
# ============================================================

global
    log /dev/log local0
    log /dev/log local1 notice

    daemon

    maxconn 4096

    # Security / performance defaults
    tune.ssl.default-dh-param 2048


# ============================================================
# Default Settings
# ============================================================

defaults
    log global

    mode tcp

    option tcplog

    timeout connect 10s
    timeout client  1m
    timeout server  1m

    # Enable TCP connection checks
    option tcp-check


# ============================================================
# Kubernetes API Server Frontend
# ============================================================

frontend kubernetes-api
    bind *:6443

    mode tcp

    default_backend kubernetes-masters


# ============================================================
# Kubernetes Control Plane Backend
# ============================================================

backend kubernetes-masters

    mode tcp

    balance roundrobin

    option tcp-check

    # --------------------------------------------------------
    # Replace the IP addresses below with your control-plane
    # node IP addresses.
    # --------------------------------------------------------

    server master01 <MASTER01-IP>:6443 check
    server master02 <MASTER02-IP>:6443 check
    server master03 <MASTER03-IP>:6443 check


# ============================================================
# Optional HAProxy Statistics
# ============================================================
#
# Uncomment this section if you want to expose the HAProxy
# statistics page.
#
# Access:
#
#   http://<LB-IP>:8404/stats
#
# ============================================================

