apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd

  template:
    metadata:
      labels:
        app: fluentd

    spec:
      serviceAccountName: fluentd

      tolerations:
        - operator: Exists

      containers:
        - name: fluentd
          image: local-fluentd:loki
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi

          volumeMounts:
            - name: varlog
              mountPath: /var/log

            - name: fluentd-config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf

      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        - name: fluentd-config
          configMap:
            name: fluentd-config
