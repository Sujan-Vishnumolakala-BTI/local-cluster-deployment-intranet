deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: openebs-hostpath
    accessModes:
      - ReadWriteOnce
    size: 20Gi

gateway:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false

  lokiCanary:
    enabled: false

test:
  enabled: false
