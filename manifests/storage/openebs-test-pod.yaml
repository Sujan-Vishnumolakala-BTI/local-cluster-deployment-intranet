apiVersion: v1
kind: Pod
metadata:
  name: openebs-test
  namespace: default
  labels:
    app: openebs-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "OpenEBS storage test" > /data/test.txt
          echo "Storage mounted successfully"
          cat /data/test.txt
          sleep 3600

      volumeMounts:
        - name: storage
          mountPath: /data

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: openebs-test-pvc
