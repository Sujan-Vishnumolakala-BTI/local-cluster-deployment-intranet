# ============================================================
# Fluentd Configuration
# Kubernetes Container Logs -> Loki
# ============================================================

# ------------------------------------------------------------
# Input
# ------------------------------------------------------------

<source>
  @type tail

  path /var/log/containers/*.log

  pos_file /var/log/fluentd-containers.log.pos

  tag kubernetes.*

  read_from_head true

  <parse>
    @type cri
  </parse>
</source>


# ------------------------------------------------------------
# Kubernetes Metadata
# ------------------------------------------------------------

<filter kubernetes.**>
  @type kubernetes_metadata
</filter>


# ------------------------------------------------------------
# Output to Loki
# ------------------------------------------------------------

<match kubernetes.**>

  @type loki

  url http://loki.logging.svc.cluster.local:3100

  extra_labels {
    "job": "fluentd",
    "cluster": "local-kubernetes"
  }

  <label>
    namespace $.kubernetes.namespace_name
    pod $.kubernetes.pod_name
    container $.kubernetes.container_name
  </label>

  line_format json

  flush_interval 10s

  flush_at_shutdown true

  buffer_type file

  buffer_path /tmp/fluentd-loki-buffer

  retry_forever true

  <buffer>
    flush_interval 10s
    retry_forever true
  </buffer>

</match>
